name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  compiler:
    name: compiler tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" numpy
      - name: FileCheck
        run: bash tests/run_filecheck.sh
      - name: Unit tests
        run: python -m pytest -q tests/test_preload.py tests/test_testdata.py
